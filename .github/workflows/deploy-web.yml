name: Deploy web demo
# Publishes the Expo web export to GitHub Pages. Enable Pages (source: GitHub Actions) in repo settings.
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build:web -w @spaced/app
        env: { EXPO_BASE_URL: '/${{ github.event.repository.name }}' }
      - run: cp app/dist/index.html app/dist/404.html   # SPA fallback for deep links
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/dist }
      - id: deployment
        uses: actions/deploy-pages@v4
